note: >-
  Fannie Mae publishes no per-API release notes. What it does publish, on a public page, is a dated
  and numbered change series for the contract that governs every external party's access to its
  applications and APIs: the Consolidated Technology Guide (the Software Subscription Agreement) and
  its accompanying Technology Guide Bulletins. Each Guide edition supersedes the prior one in full,
  and each edition ships with a Bulletin summarising the content changes. Bulletins are issued ad
  hoc, not on a schedule. Every entry below is a live, verified PDF or page URL; entry titles and
  dates are quoted from the tech-guide page, and no change contents are summarised here because the
  bulletins are PDF-only.
scheme: >-
  Guides are identified by effective date; Bulletins by a YY-NN number plus an issue date
  (for example Bulletin 26-03, issued April 21, 2026).
